<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Kanban Board</h1>

    <div class="kanban">
      <div class="column" data-status="todo">
        <h2>To Do</h2>
        <div class="card" data-id="1" data-priority="high">
          <h3>Tâche 1</h3>
          <p>Contenu de la tâche</p>
        </div>
        <div class="card" data-id="2" data-priority="low">
          <h3>Tâche 2</h3>
          <p>Autre contenu</p>
        </div>
      </div>

      <div class="column" data-status="doing">
        <h2>Doing</h2>
        <div class="card" data-id="3" data-priority="medium">
          <h3>Tâche 3</h3>
          <p>En cours de traitement</p>
        </div>
      </div>

      <div class="column" data-status="done">
        <h2>Done</h2>
        <div class="card" data-id="4" data-priority="high">
          <h3>Tâche 4</h3>
          <p>Terminé</p>
        </div>
      </div>
    </div>

    <!-- Zone pour éventuellement des boutons, un champ de recherche, etc. -->
    <div class="toolbar">
      <button id="addCardBtn">Ajouter une carte</button>
      <input
        type="text"
        id="searchInput"
        placeholder="Rechercher une carte..."
      />
      <button id="sortByPriorityBtn">Trier par priorité</button>
    </div>

    <!-- Modale d'ajout de carte -->
    <div id="addCardModal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Nouvelle Tâche</h2>
        <form id="addCardForm">
          <label for="cardTitle">Titre:</label>
          <input type="text" id="cardTitle" name="cardTitle" required />
          
          <label for="cardDesc">Description:</label>
          <textarea id="cardDesc" name="cardDesc"></textarea>
          
          <label for="cardPriority">Priorité:</label>
          <select id="cardPriority" name="cardPriority">
            <option value="low">Basse</option>
            <option value="medium" selected>Moyenne</option>
            <option value="high">Haute</option>
          </select>
          
          <button type="submit">Ajouter</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
